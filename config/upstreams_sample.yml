# scopes must be a list of strings. A scalar value (scopes: jp.hoge.*) is rejected at startup:
# it would be read one character at a time, and the * among them matches every package.
default:
  - baseUrl: https://gitlab.example.com
upstreams:
  - baseUrl: https://registry.npmjs.org
    scopes:
      - jp.hoge.*
      - com.piyo.*
  - baseUrl: https://package.openupm.com
    scopes:
      - com.fuga.*
  - baseUrl: https://vpm.example.com/vpm.json
    scopes:
      - com.example.*
    type: vpm
